name: Warm up Render (Every 5 mins)

on:
  schedule:
    # 台北時間 05:50 - 05:59 (UTC 21:50 - 21:59)
    - cron: "50,55 21 * * *"
    
    # 台北時間 06:00 - 23:59 (UTC 22:00 - 15:59)
    - cron: "*/5 22-23 * * *"
    - cron: "*/5 0-15 * * *"
    
    # 台北時間 00:00 - 00:30 (UTC 16:00 - 16:30)
    - cron: "0,5,10,15,20,25,30 16 * * *"
  
  workflow_dispatch:

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Poke Render API
        run: |
          URL="https://my-tdx-api.onrender.com/api/trains"
          
          # 嘗試取得狀態碼，設定 60 秒超時
          code=$(curl -s -L -I --max-time 60 -o /dev/null -w "%{http_code}" "$URL" || echo "Error")
          
          echo "Status Code: $code at $(date)"
          
          if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
            echo "Render is awake!"
          else
            echo "Render might be sleeping or error, status: $code"
          fi
