name: Warm up Render at 05:50 (Asia/Taipei)

on:
  schedule:
    # GitHub Actions uses UTC. Asia/Taipei 05:50 = 21:50 UTC (previous day)
    - cron: "40 21 * * *"
  workflow_dispatch:

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Warm up Render (wait until 200)
        run: |
          URL="https://my-tdx-api.onrender.com/api/trains"

          # wait up to 8 minutes
          deadline=$((SECONDS+480))

          while [ $SECONDS -lt $deadline ]; do
            code=$(curl -sS -L -I --max-time 60 -o /dev/null -w "%{http_code}" "$URL" || echo 000)
            echo "HTTP $code"

            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "Warmup OK"
              exit 0
            fi

            sleep 10
          done

          echo "Warmup FAILED (timeout waiting for 2xx/3xx)"
          exit 1
